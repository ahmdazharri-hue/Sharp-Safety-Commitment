<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety Commitment Twibbon | P2K3-SEID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">P2K3 – SEID</p>
      <h1>Safety Commitment Twibbon</h1>
      <p class="intro">Unggah foto, tulis komitmen keselamatan, lalu tanda tangani secara elektronik.</p>
    </header>

    <section class="panel form-panel">
      <label class="field">Foto
        <input id="photoInput" type="file" accept="image/*">
      </label>
      <label class="field">Nama
        <input id="nameInput" type="text" maxlength="50" placeholder="Nama lengkap">
      </label>
      <label class="field">Komitmen keselamatan
        <textarea id="commitmentInput" maxlength="220" rows="4" placeholder="Saya berkomitmen untuk ..."></textarea>
        <small><span id="charCount">0</span>/220 karakter</small>
      </label>

      <div class="field">
        <label for="signatureCanvas">Tanda tangan (gunakan jari atau mouse)</label>
        <div class="signature-wrap">
          <canvas id="signatureCanvas" width="800" height="250" aria-label="Area tanda tangan"></canvas>
        </div>
        <button type="button" id="clearSignature" class="secondary">Hapus tanda tangan</button>
      </div>
      <div class="actions">
        <button id="downloadBtn" type="button">Generate & Download PNG</button>
      </div>
      <p id="status" role="status" class="status"></p>
      <p class="privacy">Foto dan tanda tangan diproses di browser pengguna; tidak diunggah ke server oleh halaman ini.</p>
    </section>

    <section class="preview-section">
      <h2>Preview</h2>
      <div class="preview-wrap"><canvas id="previewCanvas" width="1024" height="1024"></canvas></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
