<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety Commitment Twibbon | P2K3-SEID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <header class="header">
    <div class="eyebrow">P2K3 – SEID</div>
    <h1>Safety Commitment Twibbon</h1>
    <p>Unggah foto, isi dua poin komitmen keselamatan, lalu bubuhkan tanda tangan elektronik.</p>
  </header>

  <section class="panel">
    <label class="field">Foto
      <input id="photoInput" type="file" accept="image/*">
    </label>
    <label class="field">Nama lengkap
      <input id="nameInput" type="text" maxlength="50" placeholder="Masukkan nama lengkap">
    </label>
    <label class="field">Komitmen 1 — sisi kiri
      <textarea id="commitment1" maxlength="110" rows="3" placeholder="Contoh: Saya selalu menggunakan APD sesuai standar."></textarea>
      <small><span id="count1">0</span>/110 karakter</small>
    </label>
    <label class="field">Komitmen 2 — sisi kanan
      <textarea id="commitment2" maxlength="110" rows="3" placeholder="Contoh: Saya melaporkan setiap potensi bahaya."></textarea>
      <small><span id="count2">0</span>/110 karakter</small>
    </label>
    <div class="field">
      <label for="signatureCanvas">Tanda tangan (gunakan jari atau mouse)</label>
      <div class="signature-wrap"><canvas id="signatureCanvas" width="900" height="280"></canvas></div>
      <button type="button" id="clearSignature" class="secondary">Hapus tanda tangan</button>
    </div>
    <button type="button" id="downloadBtn" class="primary">Generate &amp; Download PNG</button>
    <p id="status" class="status" role="status"></p>
    <p class="privacy">Foto dan tanda tangan diproses langsung di browser, tidak dikirim ke server.</p>
  </section>

  <section class="preview-section">
    <h2>Preview</h2>
    <div class="preview-frame"><canvas id="previewCanvas" width="768" height="768"></canvas></div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
